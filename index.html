<style>
/* The riverbed again, as a 1996 PC game would have rendered it, on a planet with two suns. Drawn at about 320 pixels wide, a handful of dithered colours, water and light cut into flat triangles that snap and shift against each other, and everything animated at ten frames a second. The harder it tries to look realistic, the more it looks like polygons. The roles are a flat overlay on top. Single deliberate look. */
:root {
  --bed: #1a1030;
  --paper: #fff7ee;
  --gut: max(24px, 4.5vmin);
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background-color: var(--bed);
  color: var(--paper);
  font-family: var(--sans);
}
#river { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; image-rendering: pixelated; image-rendering: crisp-edges; }
#roles {
  position: fixed; left: 0; right: 0; bottom: 0; margin: 0; list-style: none; pointer-events: none;
  padding-block: 0 max(var(--gut), env(safe-area-inset-bottom, 0px));
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
  text-shadow: 0 1px 14px rgba(10, 0, 30, 0.5);
}
#roles li { border-top: 1px solid rgba(255, 247, 238, 0.6); }
#roles .row {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
  gap: 0.1em 1.5em; padding: 0.5em 0 0.55em;
  color: inherit; text-decoration: none;
}
#roles a.row { pointer-events: auto; cursor: pointer; }
#roles a.row .t { transition: transform 0.18s; }
#roles a.row .t { position: relative; }
#roles a.row .t::after { content: "\2197"; position: absolute; right: 100%; margin-right: 0.35em; opacity: 0; transition: opacity 0.18s; }
#roles a.row:hover .t, #roles a.row:focus-visible .t { transform: translateX(6px); }
#roles a.row:hover .t::after, #roles a.row:focus-visible .t::after { opacity: 1; }
#roles a.row:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
@media (hover: none) { #roles a.row .t::after { display: none; } }
#roles li:last-child { border-bottom: 1px solid rgba(255, 247, 238, 0.6); }
#roles .t { font-weight: 800; font-size: clamp(17px, 2.7vw, 36px); letter-spacing: 0.035em; text-transform: uppercase; line-height: 1.05; }
#roles .d { font-weight: 500; font-size: clamp(13px, 1.3vw, 17px); letter-spacing: 0.01em; }
@media (min-width: 601px) {
  #roles { right: auto; width: 50vw; min-width: 520px; box-sizing: border-box; padding-right: 0; }
  #roles .t { font-size: clamp(17px, 2.4vw, 36px); }
  #roles .d { font-size: clamp(13px, 1.1vw, 17px); }
  #roles .row { column-gap: 0.6em; }
}
@media (max-width: 600px) {
  #roles .row { flex-direction: column; align-items: flex-start; gap: 0.25em; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('river');
  var roles = document.getElementById('roles');
  var gl = cv.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) { return; }

  var VS = '#version 300 es\nout vec2 vUv;\nvoid main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUv = p; gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }';
  var FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUv; out vec4 o;',
    'uniform sampler2D uMask; uniform vec2 uRes; uniform float uUnit, uT; uniform vec4 uR[6]; uniform vec4 uC[12];',
    'float h21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }',
    'vec2 h22(vec2 p){ vec3 q = fract(vec3(p.xyx)*vec3(0.1031, 0.1030, 0.0973)); q += dot(q, q.yzx+33.33); return fract((q.xx+q.yz)*q.zy); }',
    'float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);',
    '  return mix(mix(h21(i), h21(i+vec2(1.0,0.0)), f.x), mix(h21(i+vec2(0.0,1.0)), h21(i+vec2(1.0,1.0)), f.x), f.y); }',
    'float fbm(vec2 p){ float a = 0.5, s = 0.0; for(int i=0;i<3;i++){ s += a*vn(p); p = p*2.03 + vec2(17.1, 9.3); a *= 0.5; } return s; }',
    'float gn(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*f*(f*(f*6.0-15.0)+10.0);',
    '  vec2 g00 = h22(i)*2.0-1.0, g10 = h22(i+vec2(1.0,0.0))*2.0-1.0, g01 = h22(i+vec2(0.0,1.0))*2.0-1.0, g11 = h22(i+vec2(1.0,1.0))*2.0-1.0;',
    '  float n = mix(mix(dot(g00, f), dot(g10, f-vec2(1.0,0.0)), u.x), mix(dot(g01, f-vec2(0.0,1.0)), dot(g11, f-vec2(1.0,1.0)), u.x), u.y);',
    '  return n; }',
    'float fbmL(vec2 p){ p *= 0.62; p += 0.45*vec2(gn(p*0.6 + 3.1), gn(p*0.6 + 8.7)); float a = 0.5, s = 0.0; mat2 R = mat2(0.8, -0.6, 0.6, 0.8);',
    '  for(int i=0;i<3;i++){ s += a*gn(p); p = R*p*2.03 + vec2(17.1, 9.3); a *= 0.5; } return 0.45 + 1.15*s; }',
    'vec3 vor(vec2 p, out vec2 dv, out float id){',
    '  vec2 ip = floor(p), fp = fract(p); float f1 = 9.0, f2 = 9.0; vec2 best = vec2(0.0); float bid = 0.0;',
    '  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){',
    '    vec2 g = vec2(float(i), float(j)); vec2 r = h22(ip+g); vec2 d = g + r*0.85 + 0.075 - fp; float dd = dot(d, d);',
    '    if (dd < f1){ f2 = f1; f1 = dd; best = d; bid = h21(ip+g+7.0); } else if (dd < f2){ f2 = dd; }',
    '  }',
    '  dv = best; id = bid; return vec3(sqrt(f1), sqrt(f2), 0.0);',
    '}',
    'vec3 pal(float a){',
    '  a *= 10.0; vec3 c = vec3(0.22, 0.18, 0.40);',
    '  c = a >= 1.0 ? vec3(0.66, 0.22, 0.48) : c;',
    '  c = a >= 2.0 ? vec3(0.12, 0.52, 0.54) : c;',
    '  c = a >= 3.0 ? vec3(0.74, 0.58, 0.20) : c;',
    '  c = a >= 4.0 ? vec3(0.72, 0.68, 0.80) : c;',
    '  c = a >= 5.0 ? vec3(0.12, 0.08, 0.20) : c;',
    '  c = a >= 6.0 ? vec3(0.80, 0.36, 0.16) : c;',
    '  c = a >= 7.0 ? vec3(0.42, 0.68, 0.22) : c;',
    '  c = a >= 8.0 ? vec3(0.26, 0.36, 0.62) : c;',
    '  c = a >= 9.0 ? vec3(0.82, 0.46, 0.64) : c;',
    '  return c;',
    '}',
    'vec3 pal2(float a){',
    '  vec3 c = vec3(0.24, 0.20, 0.46);',
    '  c = a >= 0.15 ? vec3(0.66, 0.24, 0.50) : c;',
    '  c = a >= 0.30 ? vec3(0.14, 0.54, 0.56) : c;',
    '  c = a >= 0.45 ? vec3(0.76, 0.60, 0.22) : c;',
    '  c = a >= 0.58 ? vec3(0.74, 0.70, 0.82) : c;',
    '  c = a >= 0.70 ? vec3(0.80, 0.38, 0.18) : c;',
    '  c = a >= 0.80 ? vec3(0.44, 0.70, 0.26) : c;',
    '  c = a >= 0.90 ? vec3(0.30, 0.40, 0.66) : c;',
    '  c = a >= 0.96 ? vec3(0.84, 0.50, 0.66) : c;',
    '  return c;',
    '}',
    'vec3 pebbles(vec2 q, float dens, out float cov, out float ao){',
    '  vec2 ic = floor(q); float bh = 0.0; vec3 bc = vec3(0.0); float emin = 9.0;',
    '  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){',
    '    vec2 c = ic + vec2(float(i), float(j));',
    '    if (h21(c + 3.0) > dens) continue;',
    '    vec2 r = h22(c); vec2 ctr = c + 0.5 + (r - 0.5)*0.3;',
    '    float rad = 0.22 + 0.12*h21(c + 5.0); float an = h21(c + 9.0)*6.2831; float asp = 0.62 + 0.38*h21(c + 11.0);',
    '    vec2 d = q - ctr;',
    '    vec2 dl = vec2(cos(an)*d.x + sin(an)*d.y, -sin(an)*d.x + cos(an)*d.y); dl.y /= asp;',
    '    float e = length(dl)/rad; emin = min(emin, e);',
    '    if (e < 1.0){',
    '      float hh = sqrt(1.0 - e*e);',
    '      if (hh > bh){',
    '        bh = hh;',
    '        vec3 n = normalize(vec3(d/rad*0.9, hh));',
    '        float dif = 0.35 + 0.95*max(dot(n, normalize(vec3(-0.5, 0.6, 0.62))), 0.0);',
    '        float id = h21(c + 17.0);',
    '        vec3 col = pal2(id)*(0.85 + 0.3*h21(floor(q*14.0) + id*9.0));',
    '        float spec = pow(max(dot(n, normalize(vec3(-0.25, 0.35, 0.9))), 0.0), 24.0);',
    '        bc = col*dif*mix(0.55, 1.0, smoothstep(0.0, 0.35, hh)) + spec*0.25;',
    '      }',
    '    }',
    '  }',
    '  cov = step(0.0001, bh); ao = smoothstep(0.95, 1.5, emin);',
    '  return bc;',
    '}',
    'float bayer(vec2 c){',
    '  ivec2 i = ivec2(mod(c, 4.0)); int k = i.x + i.y*4;',
    '  float m[16] = float[16](0.0,8.0,2.0,10.0, 12.0,4.0,14.0,6.0, 3.0,11.0,1.0,9.0, 15.0,7.0,13.0,5.0);',
    '  return m[k]/16.0 - 0.47;',
    '}',
    'vec2 tri(vec2 p, float cs){ vec2 q = p/cs; vec2 c = floor(q); vec2 f = q - c; return (c + ((f.x + f.y < 1.0) ? vec2(0.3333) : vec2(0.6667)))*cs; }',
    'const int NW = 10;',
    'const float TH[NW] = float[](0.57, 0.92, 0.17, 1.37, -0.18, 2.0, -0.7, 0.72, 0.37, 2.8);',
    'const float LA[NW] = float[](1.9, 1.3, 2.4, 0.95, 1.6, 0.72, 2.8, 1.1, 0.5, 0.58);',
    'const float QS[NW] = float[](0.15, 0.12, 0.16, 0.10, 0.13, 0.08, 0.17, 0.11, 0.07, 0.06);',
    'const float OM[NW] = float[](0.7, 0.9, 0.55, 1.1, 0.8, 1.2, 0.5, 1.0, 1.3, 1.1);',
    'void water(vec2 p, out mat2 S, out vec2 grad){',
    '  S = mat2(0.0); grad = vec2(0.0);',
    '  for(int i=0;i<NW;i++){',
    '    vec2 kh = vec2(cos(TH[i]), sin(TH[i])); float k = 6.2831853/LA[i];',
    '    float ph = k*dot(kh, p) - OM[i]*uT + float(i)*1.7;',
    '    float sn = sin(ph), cs = cos(ph);',
    '    S += QS[i]*sn*outerProduct(kh, kh);',
    '    grad += (QS[i]/k)*cs*kh;',
    '  }',
    '  for(int r=0;r<6;r++){',
    '    vec4 R = uR[r]; float age = uT - R.z;',
    '    if (R.w <= 0.0 || age < 0.0 || age > 8.0) continue;',
    '    vec2 dv = p - R.xy; float rr = length(dv) + 1e-4; vec2 rh = dv/rr;',
    '    float u = rr - 0.8*age; float w = 0.55; float kk = 6.2831853/0.55;',
    '    float e = exp(-(u/w)*(u/w)); float cs = cos(kk*u), sn = sin(kk*u);',
    '    float g1 = e*(-2.0*u/(w*w)*cs - kk*sn);',
    '    float g2 = e*((4.0*u*u/(w*w*w*w) - 2.0/(w*w))*cs + 4.0*u*kk/(w*w)*sn - kk*kk*cs);',
    '    float A = R.w*exp(-age/2.4)/(kk*kk);',
    '    grad += A*g1*rh;',
    '    mat2 I2 = mat2(1.0);',
    '    S -= A*g2*outerProduct(rh, rh) + (A*g1/rr)*(I2 - outerProduct(rh, rh));',
    '  }',
    '}',
    'float caustic(mat2 S){',
    '  float s = 2.0; float det = (1.0 + s*S[0][0])*(1.0 + s*S[1][1]) - s*s*S[0][1]*S[1][0];',
    '  return pow(clamp(0.08/(abs(det) + 0.08), 0.0, 1.0), 1.4);',
    '}',
    'void main(){',
    '  vec2 uv = vUv;',
    '  vec2 p = uv*uRes/uUnit;',
    '  vec2 fd = vec2(0.84, 0.54), fp = vec2(-0.54, 0.84);',
    /* refraction: one flat displacement per big triangle */
    '  mat2 S0; vec2 g0; water(p, S0, g0);',
    '  vec2 pd = p - 0.45*g0; pd = (floor(pd*uUnit) + 0.5)/uUnit;',
    /* light: one flat value per small triangle, two suns */
    '  vec2 pl = tri(p, 0.09);',
    '  mat2 S1 = S0; vec2 g1 = g0;',
    '  mat2 S2; vec2 g2; water(p + vec2(0.7, -0.4), S2, g2);',
    '  float c1 = caustic(S1), c2 = caustic(S2);',
    '  vec2 sd = vec2(0.56, -0.83), sq = vec2(0.83, 0.56);',
    '  vec2 qa = vec2(dot(p, sd)*0.42, dot(p, sq)*1.05) + vec2(0.0, 0.035*uT) + 0.35*vec2(sin(uT*0.07), cos(uT*0.05));',
    '  vec2 qb = vec2(dot(p, sd)*0.5, dot(p, sq)*0.9) + vec2(0.0, -0.03*uT) + 7.0;',
    '  float m1 = smoothstep(0.40, 0.54, fbmL(qa + 3.0));',
    '  float m2 = smoothstep(0.42, 0.56, fbmL(qb));',
    '  float lsh = smoothstep(0.50, 0.60, fbmL(p*1.7 + vec2(0.08*uT, 0.4*sin(uT*0.25)) + 30.0));',
    '  m1 *= 1.0 - 0.7*lsh; m2 *= 1.0 - 0.55*lsh;',
    '  vec3 shade = vec3(0.48, 0.44, 0.70)*(1.0 - 0.22*lsh);',
    '  vec3 light = shade + vec3(2.2, 1.38, 0.72)*m1*(0.5 + 1.7*c1) + vec3(0.4, 1.4, 1.85)*m2*(0.4 + 1.5*c2);',
    /* the bed: rippled sand, gravel, rounded pebbles */
    '  float rip = dot(pd, fd)*5.0 + 0.9*sin(dot(pd, fp)*2.1 + 1.3*vn(pd*1.3)) + 0.6*vn(pd*3.0);',
    '  float rv = sin(rip*2.6);',
    '  vec3 bed = vec3(0.52, 0.45, 0.66)*(0.86 + 0.12*step(0.0, rv) + 0.06*step(0.8, rv))*1.0;',
    '  float rg = smoothstep(0.35, 0.65, fbm(pd*0.5 + 2.0));',
    '  float rb = smoothstep(0.35, 0.65, fbm(pd*0.4 + 12.0));',
    '  float gcov, gao; vec3 gv = pebbles(pd*2.6 + 7.0, 0.1 + 0.4*rg, gcov, gao);',
    '  bed *= mix(0.6, 1.0, gao);',
    '  bed = gcov > 0.5 ? gv*0.9 : bed;',
    '  float bcov, bao; vec3 bv = pebbles(pd*0.6 + 2.0, 0.55 + 0.45*rb, bcov, bao);',
    '  bed *= mix(0.4, 1.0, bao);',
    '  bed = bcov > 0.5 ? bv : bed;',
    '  bed = mix(bed, vec3(0.20, 0.10, 0.36), 0.05);',
    /* tufts: little alien sedges and anemones */
    '  vec3 tglow = vec3(0.0);',
    '  { vec2 tq = pd*1.15 + 20.0; vec2 tic = floor(tq);',
    '    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){',
    '      vec2 tc = tic + vec2(float(i), float(j)); float th = h21(tc + 1.0);',
    '      if (th < 0.76) continue;',
    '      vec2 ctr = tc + 0.5 + (h22(tc + 4.0) - 0.5)*0.5;',
    '      vec2 d = (tq - ctr)/1.15; float dd = length(d); float R = 0.2 + 0.3*h21(tc + 8.0);',
    '      if (dd > R*1.25) continue;',
    '      float ang = atan(d.y, d.x) + 0.35*sin(uT*0.9 + th*30.0)*dd/R;',
    '      float N = 6.0 + floor(h21(tc + 3.0)*5.0);',
    '      float blade = step(0.45 + 0.5*dd/R, cos(ang*N))*step(dd, R);',
    '      if (dd < R*1.25 && blade < 0.5) bed *= mix(1.0, 0.78, step(dd, R*1.15));',
    '      vec3 tip = th > 0.78 ? vec3(0.95, 0.28, 0.74) : vec3(0.25, 0.95, 0.65);',
    '      vec3 tcol = mix(vec3(0.05, 0.28, 0.26), tip, smoothstep(0.35, 1.0, dd/R));',
    '      if (blade > 0.5){ bed = tcol*0.8; tglow = tip*smoothstep(0.7, 1.0, dd/R); }',
    '    }',
    '  }',
    /* alien weed: glowing tendrils swaying downstream */
    '  vec2 wq = vec2(dot(pd, fd), dot(pd, fp));',
    '  float ly = wq.y*4.5 + 0.55*sin(wq.x*1.4 + uT*0.8 + floor(wq.y*4.5)*2.1) + 0.25*sin(wq.x*3.1 - uT*1.3);',
    '  float lf = abs(fract(ly) - 0.5); float ln = floor(ly);',
    '  float strand = step(lf, 0.1)*step(0.55, h21(vec2(ln, 4.0)));',
    '  float wpatch = smoothstep(0.56, 0.70, fbm(pd*0.55 + 9.0));',
    '  float wh = h21(vec2(ln, 9.0));',
    '  vec3 weedC = wh > 0.5 ? vec3(0.10, 0.80, 0.66) : vec3(0.88, 0.22, 0.72);',
    '  float sw = strand*wpatch;',
    '  bed = mix(bed, weedC*0.7, sw);',
    '  vec3 aglow = vec3(0.0);',
    '  { vec2 ac = floor(pd/3.4);',
    '    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){',
    '      vec2 c = ac + vec2(float(i), float(j));',
    '      if (h21(c + 21.0) > 0.42) continue;',
    '      vec2 root = (c + 0.2 + 0.6*h22(c + 5.0))*3.4;',
    '      vec2 d = pd - root; float s = dot(d, fd), nn = dot(d, fp);',
    '      if (s < -0.1 || s > 3.1) continue;',
    '      for(int k=0;k<5;k++){',
    '        float fk = float(k); float hk = h21(c + fk*1.7 + 40.0);',
    '        float Ls = 1.5 + 1.5*hk;',
    '        if (s > Ls) continue;',
    '        float u = clamp(s/Ls, 0.0, 1.0);',
    '        float amp = 0.28*pow(u, 0.8);',
    '        float cn = (fk - 2.0)*0.08*(0.3 + u) + amp*sin(s*2.6 - uT*1.0 + hk*6.0) + 0.1*amp*sin(s*7.0 - uT*2.3 + fk);',
    '        float hw = 0.075*(1.0 - 0.55*u);',
    '        float dn = abs(nn - cn);',
    '        if (dn < hw + 0.05) {',
    '          vec3 ac2 = mix(vec3(0.16, 0.52, 0.18), vec3(0.72, 0.92, 0.30), u);',
    '          if (hk > 0.6) ac2 = mix(vec3(0.10, 0.56, 0.50), vec3(0.45, 0.95, 0.82), u);',

      L.td = stepT;
    }
  }
  function drawMask() {
    var k0 = LW / W;
    mc.setTransform(1, 0, 0, 1, 0, 0);
    mc.globalCompositeOperation = 'source-over';
    mc.fillStyle = '#000'; mc.fillRect(0, 0, LW, LH);
    mc.globalCompositeOperation = 'lighter';
    mc.font = '800 ' + sN + 'px ' + FAM; if ('fontKerning' in mc) mc.fontKerning = 'none';
    mc.textBaseline = 'alphabetic';
    var snap = PX * 1.0;
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < letters.length; i++) {
        var L = letters[i];
        var off = pass === 0 ? (0.02 + 0.11 * L.a) * sN : 0;
        mc.save();
        mc.setTransform(k0, 0, 0, k0, 0, 0);
        var tx = Math.round((L.x + L.ox + SD[0] * off) / snap) * snap;
        var ty = Math.round((L.y + L.oy + SD[1] * off) / snap) * snap;
        mc.translate(tx, ty);
        mc.rotate(ANG + Math.round(L.rot * 24) / 24);
        var sc = 1 + 0.05 * Math.round(L.a * 4) / 4; mc.scale(sc, sc);
        mc.fillStyle = pass === 0 ? 'rgb(0,0,255)' : '#f00';
        mc.fillText(L.ch, -L.w / 2, CAP * sN / 2);
        mc.restore();
      }
    }
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mk);
  }

  window.addEventListener('pointermove', function (e) {
    var now = performance.now();
    if (reduce) return;
    if (Math.hypot(e.clientX - lastDrop.x, e.clientY - lastDrop.y) > 80 && now - lastDrop.t > 160) {
      lastDrop = { x: e.clientX, y: e.clientY, t: now };
      drop(e.clientX, e.clientY, 0.3);
    }
  }, { passive: true });
  window.addEventListener('pointerdown', function (e) {
    if (reduce) return;
    drop(e.clientX, e.clientY, 0.5);
    disturb(e.clientX, e.clientY);
  }, { passive: true });

  var lastStep = -1;
  function frame(now) {
    var dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;
    if (!reduce) clock += dt;
    var st = Math.floor(clock * 10) / 10;
    if (st !== lastStep) {
      var n = lastStep < 0 ? 1 : Math.max(1, Math.min(5, Math.round((st - lastStep) * 10)));
      lastStep = st; stepT = st;
      if (!reduce) { for (var k = 0; k < n; k++) { simulate(stepT); swim(); } dirty = true; }
      upload();
      if (dirty) { drawMask(); dirty = false; }
      gl.uniform1f(uT, stepT);
      gl.uniform4fv(uR, ripples);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(frame);
  }

  var pend = false;
  window.addEventListener('resize', function () {
    if (pend) return;
    pend = true;
    requestAnimationFrame(function () { pend = false; layout(); lastStep = -1; });
  });

  layout();
  if (document.fonts) {
    try {
      Promise.all([document.fonts.load('800 100px Archivo'), document.fonts.load('500 20px Archivo')]).then(function () { layout(); lastStep = -1; }, function () {});
    } catch (e) {}
  }
  /*DEBUG*/
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
